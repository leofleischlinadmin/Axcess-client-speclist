<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Client Selections | Axcess Construction Management Services</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="/auth.js"></script>
<style>
:root{--bg:#F3F5FA;--surface:#fff;--ink:#111418;--muted:#5A6275;--line:#D6DCEA;--accent:#1018A6;--accent-ink:#fff;--warm:#2DBE45;--soft:#E3E9F8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101322;--surface:#181C30;--ink:#E9ECF7;--muted:#9CA4BF;--line:#2A3050;--accent:#8FA3FF;--accent-ink:#0B0E1E;--warm:#4FD36A;--soft:#222845}}
:root[data-theme="dark"]{--bg:#101322;--surface:#181C30;--ink:#E9ECF7;--muted:#9CA4BF;--line:#2A3050;--accent:#8FA3FF;--accent-ink:#0B0E1E;--warm:#4FD36A;--soft:#222845}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Hanken Grotesk",system-ui,sans-serif}
h1,h2,h3{font-family:"Saira Condensed","Arial Narrow",sans-serif;font-weight:600;margin:0;letter-spacing:.01em}.logo{height:68px;width:auto;background:#fff;border-radius:6px;padding:3px;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.bar h1{font-size:26px;flex:1 1 auto}
.tabs{display:flex;gap:4px}
.tab{border:1px solid var(--line);background:none;padding:6px 14px;border-radius:99px}
.tab[aria-current=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.prog{max-width:1180px;margin:0 auto;padding:0 20px 12px;font-size:14px;color:var(--muted)}
.track{height:6px;background:var(--soft);border-radius:9px;margin-top:6px;overflow:hidden}
.track i{display:block;height:100%;background:var(--warm);width:0;transition:width .3s}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:8px 16px;font-weight:600}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
main{max-width:1180px;margin:0 auto;padding:20px}
.rooms{max-width:720px}
.rooms h2{font-size:28px;margin-bottom:6px}
.lead{color:var(--muted);margin:0 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 13px;font-size:14px}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.add{display:flex;gap:8px;margin:14px 0 22px}
.add input{flex:1;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.mine{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.mine span{background:var(--soft);border-radius:8px;padding:5px 6px 5px 12px;font-size:14px}
.mine button{border:0;background:none;color:var(--muted);padding:0 6px;font-size:16px}
.grid{display:grid;grid-template-columns:270px 1fr;gap:28px;align-items:start}
nav{position:sticky;top:120px;max-height:calc(100vh - 150px);overflow:auto;padding-right:6px}
nav h3{font-size:13px;color:var(--muted);margin:14px 0 4px;font-family:inherit;font-weight:600}
nav button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:8px;font-size:14px}
nav button[aria-current=true]{background:var(--soft);font-weight:600}
nav small{color:var(--muted);white-space:nowrap}
#catsel{display:none;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:12px}
.tools{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tools input,.tools select{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tools input{flex:1 1 200px}
.head h2{font-size:26px}
.head p{color:var(--muted);margin:2px 0 14px;font-size:14px}
details.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary b{font-weight:500}
summary .sub{display:block;font-size:12.5px;color:var(--muted)}
.pill{font-size:12px;border-radius:99px;padding:2px 10px;background:var(--soft);white-space:nowrap}
.pill.y{background:var(--accent);color:var(--accent-ink)}
.body{padding:2px 14px 14px;border-top:1px solid var(--line)}
.body label,.lbl{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 16px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:0 14px}
.fields .w{grid-column:1/-1}
.body input[type=text],.body textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.detail{display:none}
.card[data-know=Yes] .detail{display:grid}
.sm{display:flex;gap:10px;align-items:center}.thw:empty{display:none}.th{width:44px;height:44px;border-radius:6px;object-fit:cover;display:block}
.ph{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.ph .t{position:relative;width:96px;height:96px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.ph .t img{width:100%;height:100%;object-fit:cover;display:block}
.ph .t button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;line-height:1;padding:0}
.ph .addp{width:96px;height:96px;border:1.5px dashed var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;color:var(--accent);cursor:pointer;padding:6px;margin:0}
.ph .addp input{display:none}
.ref{width:120px;padding:0;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);text-align:left}
.ref img{width:100%;height:96px;object-fit:cover;display:block}
.ref span{display:block;font-size:12.5px;padding:4px 8px}
.ref[aria-pressed=true]{border-color:var(--accent)}
.ref[aria-pressed=true] span::before{content:"\2665 ";color:var(--accent)}
.nav2{border:1px solid var(--line);background:none;padding:6px 14px;border-radius:99px}#sync{font-size:13px;color:var(--muted)}
body:not([data-v=project]) :is(.tabs,.prog,#exp,#sync){display:none}
.login input{display:block;width:100%;padding:10px 12px;margin-bottom:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.pcard{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:8px}.pcard span{color:var(--muted);font-size:14px}
.prow{display:flex;gap:8px;margin-bottom:8px}.prow .pcard{margin-bottom:0;flex:1}.delp{border:1px solid var(--line);background:none;border-radius:10px;padding:0 14px;color:#D64545}
.cp{margin:14px 0 4px}.cpr{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}.wheel{width:180px;height:180px;touch-action:none;cursor:crosshair}.cpi{flex:1 1 220px}
.sw{height:44px;border-radius:8px;border:1px solid var(--line);background:var(--soft);margin-bottom:4px}.lk{display:inline-block;margin:10px 0 2px;color:var(--accent);font-size:14px}.hint{font-size:12px;color:var(--muted);margin:4px 0 0}
#chat{background:var(--surface);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;box-shadow:0 10px 36px rgba(16,24,166,.10);overflow:hidden}
#chat[hidden]{display:none}.hero #chat{height:400px}.pv #chat{height:calc(100vh - 170px);min-height:380px;position:sticky;top:128px}
.ch{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.orb{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);align-items:center;justify-content:center;font-size:14px;flex:none}
#cm{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}.m{max-width:88%;padding:9px 13px;border-radius:14px;font-size:15px;white-space:pre-wrap}
.m.a{background:var(--soft);align-self:flex-start}.m.u{background:var(--accent);color:var(--accent-ink);align-self:flex-end}.m.n{font-size:12px;color:var(--muted);align-self:center;padding:0}
#cq{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}.cf{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}.cf input{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:99px;background:var(--bg)}
.cn{font-size:11px;color:var(--muted);margin:0;padding:0 14px 8px}
.hero{max-width:820px;margin:0 auto;background:var(--soft);border-radius:24px;padding:22px 20px 20px}.tagl{font:600 30px/1.2 "Saira Condensed","Arial Narrow",sans-serif;text-align:center;margin:6px 6px 18px}.tagl .orb{margin-right:10px;vertical-align:middle}
.plist{max-width:820px;margin:32px auto 0}.plist h2{font-size:28px;margin-bottom:12px}.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}.po{text-align:left;background:none;border:0;padding:0;display:flex;flex-direction:column;gap:4px}.po span{font-size:13px;color:var(--muted)}
.bar2{display:block;height:6px;background:var(--soft);border-radius:9px;overflow:hidden;margin-top:4px}.bar2 u{display:block;height:100%;background:var(--warm)}.pc .delp{align-self:flex-start;padding:4px 12px;font-size:13px}
.pv{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start}
@media(max-width:1000px){.pv{grid-template-columns:1fr}.pv #chat{position:static;height:340px;order:-1}}

body[data-v=projects]{font-family:Inter,"Hanken Grotesk",system-ui,sans-serif}
body[data-v=projects] :is(h1,h2,h3){font-family:Inter,system-ui,sans-serif;letter-spacing:-.02em}
@media (prefers-color-scheme:light){body[data-v=projects]{--bg:#fff;--ink:#0A2540;--muted:#425466;--line:#E3E8EE;--soft:#F6F9FC}}
body[data-v=projects] main{max-width:none;padding:0}
.hero2{position:relative;overflow:hidden;padding:64px 20px 60px;text-align:center;background:radial-gradient(900px 380px at 12% -10%,rgba(96,144,216,.40),transparent 65%),radial-gradient(800px 360px at 92% 0%,rgba(16,24,166,.22),transparent 65%),radial-gradient(700px 320px at 55% 115%,rgba(51,255,68,.15),transparent 65%),var(--bg)}
.eyebrow{display:inline-block;font-size:13px;font-weight:500;color:var(--accent);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 14px;margin-bottom:20px}
.hl{max-width:800px;margin:0 auto 30px;font-size:clamp(30px,4.6vw,48px);line-height:1.12;font-weight:600;letter-spacing:-.025em;color:var(--ink)}
.hl em{font-style:normal;background:linear-gradient(90deg,#1018A6,#4A7BE0);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero2 #chat{max-width:760px;margin:0 auto;height:420px;text-align:left;border-radius:16px;box-shadow:0 30px 60px -20px rgba(50,50,93,.25),0 18px 36px -18px rgba(0,0,0,.2)}
.sect{max-width:1080px;margin:0 auto;padding:60px 20px}.sect>h2{font-size:30px;font-weight:600;margin:0 0 6px}.sect>.sub{color:var(--muted);margin:0 0 24px}
.band{background:var(--soft)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:box-shadow .2s,transform .2s}
.pc:hover{box-shadow:0 13px 27px -5px rgba(50,50,93,.22),0 8px 16px -8px rgba(0,0,0,.25);transform:translateY(-1px)}
.wgrid{display:grid;grid-template-columns:1.05fr 1fr;gap:44px;align-items:start}
.wgrid h2{font-size:clamp(28px,3.6vw,40px);line-height:1.12;font-weight:600;margin:0 0 14px}.wgrid p{color:var(--muted);line-height:1.65;margin:0 0 14px}
.fc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:12px}.fc b{display:block;margin-bottom:4px;color:var(--ink)}.fc span{color:var(--muted);font-size:15px;line-height:1.55}
.beliefs{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.beliefs span{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:14px;font-weight:500;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:44px;padding-top:28px;border-top:1px solid var(--line)}.stats b{display:block;font-size:30px;font-weight:600;letter-spacing:-.02em;color:var(--ink)}.stats span{font-size:14px;color:var(--muted)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.cc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}.cc h3{font-size:17px;font-weight:600;margin:12px 0 8px}.cc p{margin:0 0 6px;color:var(--muted);font-size:15px;line-height:1.5}.cc a{color:var(--accent);text-decoration:none;font-weight:500}.cc a:hover{text-decoration:underline}
.ico{width:40px;height:40px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.foot{border-top:1px solid var(--line);padding:26px 20px 44px;text-align:center;font-size:13px;color:var(--muted)}.foot a{color:var(--accent);text-decoration:none}
@media(max-width:820px){.wgrid{grid-template-columns:1fr;gap:24px}.stats{grid-template-columns:1fr}.hero2{padding:44px 16px 40px}}
.empty{color:var(--muted);padding:20px 0}
@media(max-width:820px){.grid{grid-template-columns:1fr}nav{display:none}#catsel{display:block}.fields{grid-template-columns:1fr}}
</style>
</head>

const projHtml=()=>'<div class="rooms"><h2>Your projects</h2><p class="lead">'+esc(ME.email)+'</p><div class="add"><input id="pname" type="text" placeholder="New project name, e.g. Smith Residence"><button class="btn" id="newp">Create project</button></div>'+(PL.length?PL.map(p=>'<div class="prow"><button class="pcard" data-open="'+p.id+'" data-name="'+esc(p.name)+'"><b>'+esc(p.name)+'</b><span>'+(p.owner!==ME.id?esc(p.ownerEmail)+" \u00b7 ":"")+p.n+" of "+total+' items noted</span></button><button class="delp" data-delp="'+p.id+'" data-name="'+esc(p.name)+'" aria-label="Delete project">Delete</button></div>').join(""):'<p class="empty">No projects yet. Create your first one above.</p>')+"</div>";
async function showProjects(){V="projects";PID=null;try{PL=await api("GET","/api/projects")}catch(e){PL=[]}render()}
async function openP(id,name){try{const st=await api("GET","/api/projects/"+id);PID=id;PN=name;S=Object.assign(blank(),st);for(const k in P)delete P[k];Object.entries(S.ph).forEach(([i,a])=>{P[i]=a.map(x=>({id:x,url:"/api/photo/"+id+"/"+x}))});V="project";$("#sync").textContent="";render();scrollTo(0,0)}catch(e){alert("Could not open this project: "+e.message)}}
M.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.delp){if(!confirm('Delete "'+b.dataset.name+'" and all its photos? This cannot be undone.'))return;try{await api("DELETE","/api/projects/"+b.dataset.delp);await showProjects()}catch(x){alert(x.message)}return}
 if(b.dataset.open)return openP(b.dataset.open,b.dataset.name);
 if(b.id==="login"||b.id==="signup"){const m=$("#msg");m.textContent="One moment\u2026";try{const em=$("#em").value.trim(),pw=$("#pw").value;if(b.id==="login"){ME=await Auth.login(em,pw);await showProjects()}else{await Auth.signup(em,pw);m.textContent="Check your email for a confirmation link, then log in."}}catch(x){m.textContent=x.message||"Something went wrong. Check your email and password."}}
 if(b.id==="forgot"){const m=$("#msg"),em=$("#em").value.trim();if(!em){m.textContent="Type your email above first.";return}try{await Auth.requestPasswordRecovery(em)}catch(x){}m.textContent="If that email has an account, a reset link is on its way. Check spam too."}
 if(b.id==="setpw"){const m=$("#msg"),p=$("#np").value;if(p.length<8){m.textContent="Use at least 8 characters.";return}if(p!==$("#np2").value){m.textContent="The two passwords do not match.";return}try{if(INV){ME=await Auth.acceptInvite(INV,p);INV=null}else await Auth.updateUser({password:p});await showProjects()}catch(x){m.textContent=x.message||"Could not save the password. Try the reset link again."}}
 if(b.id==="newp"){const n=$("#pname").value.trim();if(n){try{const p=await api("POST","/api/projects",{name:n});openP(p.id,p.name)}catch(x){alert(x.message)}}}});

const isColor=i=>{const it=D.items[i];return it[1]==="Painting / Coatings"||/paint|stain|colou?r/i.test(it[2])};
function colorBlock(i){if(!isColor(i))return"";const r=S.d[i]||{},hx=r.hx||"";return '<div class="cp"><span class="lbl">Pick a color (approximate on screen)</span><div class="cpr"><canvas class="wheel" width="180" height="180"></canvas><div class="cpi"><div class="sw" style="'+(hx?"background:"+hx:"")+'"></div><label>Hex code</label><input type="text" data-cx maxlength="7" placeholder="#558A62" value="'+hx+'"><label>Paint brand, color name or code</label><input type="text" data-f="bn" placeholder="e.g. Behr Adirondack Blue N480-5" value="'+esc(r.bn)+'"><a class="lk" href="https://www.behr.com/colors/all-paint-colors" target="_blank" rel="noopener">Browse Behr colors</a><p class="hint">Screen colors differ from real paint. Please confirm with a physical sample.</p></div></div></div>'}
function hsv2hex(h,s,v){const f=n=>{const k=(n+h/60)%6,x=v-v*s*Math.max(0,Math.min(k,4-k,1));return Math.round(x*255).toString(16).padStart(2,"0")};return("#"+f(5)+f(3)+f(1)).toUpperCase()}
function hex2hsv(x){const r=parseInt(x.slice(1,3),16)/255,g=parseInt(x.slice(3,5),16)/255,b=parseInt(x.slice(5,7),16)/255,M=Math.max(r,g,b),m=Math.min(r,g,b),d=M-m;let h=0;if(d){h=M===r?((g-b)/d)%6:M===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}return [h,M?d/M:0,M]}
const mark=(g,x,y)=>{g.beginPath();g.arc(x,y,6,0,7);g.lineWidth=2;g.strokeStyle="#fff";g.stroke();g.beginPath();g.arc(x,y,7.5,0,7);g.lineWidth=1;g.strokeStyle="rgba(0,0,0,.5)";g.stroke()};
function drawWheel(cv){const g=cv.getContext("2d"),c=90,ro=88,ri=68,q=46,hue=+cv.dataset.h||0;g.clearRect(0,0,180,180);
 const cg=g.createConicGradient(-Math.PI/2,c,c);for(let k=0;k<=360;k+=10)cg.addColorStop(k/360,"hsl("+k+",100%,50%)");
 g.beginPath();g.arc(c,c,ro,0,7);g.arc(c,c,ri,0,7,true);g.fillStyle=cg;g.fill();
 g.fillStyle="hsl("+hue+",100%,50%)";g.fillRect(c-q,c-q,2*q,2*q);
 let lg=g.createLinearGradient(c-q,0,c+q,0);lg.addColorStop(0,"#fff");lg.addColorStop(1,"rgba(255,255,255,0)");g.fillStyle=lg;g.fillRect(c-q,c-q,2*q,2*q);
 lg=g.createLinearGradient(0,c-q,0,c+q);lg.addColorStop(0,"rgba(0,0,0,0)");lg.addColorStop(1,"#000");g.fillStyle=lg;g.fillRect(c-q,c-q,2*q,2*q);
 const a=(hue-90)*Math.PI/180;mark(g,c+78*Math.cos(a),c+78*Math.sin(a));mark(g,c-q+(+cv.dataset.s)*2*q,c-q+(1-(+cv.dataset.v))*2*q)}
function setColor(card,hx,fromInput){const i=card.dataset.i;rec(i).hx=hx;card.querySelector(".sw").style.background=hx||"";if(!fromInput)card.querySelector("[data-cx]").value=hx;card.querySelector(".st").innerHTML=status(i);save();refresh()}
function pick(cv,e){const R=cv.getBoundingClientRect(),k=180/R.width,x=(e.clientX-R.left)*k-90,y=(e.clientY-R.top)*k-90;
 if(cv.dataset.m==="ring")cv.dataset.h=(Math.atan2(y,x)*180/Math.PI+450)%360;
 else{cv.dataset.s=Math.min(1,Math.max(0,(x+46)/92));cv.dataset.v=1-Math.min(1,Math.max(0,(y+46)/92))}
 setColor(cv.closest(".card"),hsv2hex(+cv.dataset.h,+cv.dataset.s,+cv.dataset.v),false);drawWheel(cv)}
function initWheel(cv){const r=rec(cv.closest(".card").dataset.i),a=r.hx?hex2hsv(r.hx):[210,.5,.6];cv.dataset.h=a[0];cv.dataset.s=a[1];cv.dataset.v=a[2];cv.dataset.ok=1;drawWheel(cv);
 cv.addEventListener("pointerdown",e=>{const R=cv.getBoundingClientRect(),k=180/R.width,x=(e.clientX-R.left)*k-90,y=(e.clientY-R.top)*k-90,d=Math.hypot(x,y);cv.dataset.m=d>=62&&d<=92?"ring":(Math.abs(x)<=46&&Math.abs(y)<=46?"sq":"");if(cv.dataset.m){cv.setPointerCapture(e.pointerId);pick(cv,e)}});
 cv.addEventListener("pointermove",e=>{if(cv.dataset.m)pick(cv,e)});cv.addEventListener("pointerup",()=>{cv.dataset.m=""})}
M.addEventListener("toggle",e=>{const c=e.target.querySelector&&e.target.querySelector(".wheel");if(c&&!c.dataset.ok)initWheel(c)},true);
M.addEventListener("input",e=>{const el=e.target;if(!el.hasAttribute||!el.hasAttribute("data-cx"))return;const card=el.closest(".card");let v=el.value.trim();if(v&&v[0]!=="#")v="#"+v;
 if(/^#[0-9a-fA-F]{6}$/.test(v)){v=v.toUpperCase();setColor(card,v,true);const cv=card.querySelector(".wheel"),a=hex2hsv(v);cv.dataset.h=a[0];cv.dataset.s=a[1];cv.dataset.v=a[2];drawWheel(cv)}else if(!v)setColor(card,"",true)});
let busy=false,auto=0,CK="home",START=false,CAME="";const CHS={},LOG={},ONB={ph:"name"};
const hist=()=>CHS[CK]||(CHS[CK]=[]),logs=()=>LOG[CK]||(LOG[CK]=[]);
function paint(t,c){const d=document.createElement("div");d.className="m "+c;d.textContent=t;const m=$("#cm");m.appendChild(d);m.scrollTop=m.scrollHeight;return d}
function say(t,c){logs().push({t,c});return paint(t,c)}
function mountChat(){const want=V==="project"?PID:"home",m=$("#cm");if(m.dataset.k===want)return;CK=want;m.dataset.k=want;m.innerHTML="";$("#cq").innerHTML="";logs().forEach(x=>paint(x.t,x.c));if(!logs().length)greet()}
function greet(){if(CK==="home"){ONB.ph="name";say("Let's get started! What do you want to name your project?","a");return}
 if(START){START=false;send("(The rooms are set. Begin guiding me through the selections.)",true);return}
 const n=D.items.filter((_,i)=>touched(i)).length;say("Welcome back to "+PN+"! You have "+n+" of "+total+" items noted. Want to pick up where you left off?","a");showChoices({choices:["Keep going","What did I miss?"]})}
function chatCtx(){const c=cats[S.cat]||cats[0];return {project:PN,rooms:S.rooms,commonRooms:COMMON,focus:{category:c.name,division:D.divs[c.div],items:c.ix.map(i=>{const r=S.d[i]||{};return {id:i,name:D.items[i][2],know:r.k||"",rooms:r.r||[],preference:r.p||""}})},allCategories:cats.map(c=>c.name),cameFrom:CAME,remaining:cats.filter(x=>x.ix.some(i=>!touched(i))).map(x=>x.name+" ("+x.ix.filter(i=>!touched(i)).length+")")}}
function showChoices(x){const q=$("#cq");q.innerHTML="";const sel=new Set();
 (x.choices||[]).slice(0,24).forEach(t=>{const b=document.createElement("button");b.className="chip";b.textContent=t;b.setAttribute("aria-pressed","false");b.onclick=()=>{if(x.multi){sel.has(t)?sel.delete(t):sel.add(t);b.setAttribute("aria-pressed",sel.has(t))}else submit(t)};q.appendChild(b)});
 if(x.multi){const d=document.createElement("button");d.className="btn";d.textContent="Done";d.onclick=()=>{if(sel.size)submit([...sel].join(", "))};q.appendChild(d)}}
function applyAct(a){const n=a.name,x=a.input||{};
 if(n==="add_rooms"){const add=(x.rooms||[]).map(s=>String(s).trim()).filter(s=>s&&!S.rooms.includes(s));if(add.length){S.rooms.push(...add);say("Added rooms: "+add.join(", "),"n")}}
 else if(n==="update_item"){const i=+x.id;if(!Number.isInteger(i)||!D.items[i])return;const r=rec(i);if(x.know==="Yes"||x.know==="No")r.k=x.know;if(Array.isArray(x.rooms))r.r=x.rooms.filter(s=>S.rooms.includes(s));if(x.preference)r.p=String(x.preference).slice(0,300);if(x.notes)r.n=String(x.notes).slice(0,300);say("Saved: "+D.items[i][2],"n")}
 else if(n==="go_to_category"){const q=String(x.name||"").toLowerCase();let ci=cats.findIndex(c=>c.name.toLowerCase()===q);if(ci<0)ci=cats.findIndex(c=>c.name.toLowerCase().includes(q));if(ci<0&&q){const k=D.items.findIndex(it=>it[2].toLowerCase().includes(q));if(k>=0)ci=cats.findIndex(c=>c.ix.includes(k))}if(ci>=0){CAME=(cats[S.cat]||{}).name||"";S.cat=ci;S.step="items";S.q="";return"moved"}}
 else if(n==="offer_choices")showChoices(x)}
async function send(t,hidden){if(busy||!t)return;busy=true;$("#cq").innerHTML="";if(!hidden)say(t,"u");hist().push({role:"user",content:t});
 const th=paint("Thinking...","n");
 try{const r=await fetch("/ai/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:hist().slice(-14),ctx:chatCtx()})});const j=await r.json().catch(()=>({}));th.remove();if(!r.ok)throw new Error(j.error||"The assistant is unavailable right now.");
  if(j.text)say(j.text,"a");let moved=false;const notes=[];
  for(const a of j.actions||[]){if(applyAct(a)==="moved")moved=true;if(a.name==="update_item"&&D.items[+a.input.id])notes.push(D.items[+a.input.id][2]+"="+a.input.know);else if(a.name!=="offer_choices")notes.push(a.name)}
  hist().push({role:"assistant",content:(j.text||"")+(notes.length?" [done: "+notes.join("; ")+"]":"")});save();render();busy=false;
  if(moved&&!auto){auto=1;await send("(You are now in "+cats[S.cat].name+". Carry on with what the client just asked for.)",true);auto=0}
 }catch(e){th.remove();say(e.message||"Something went wrong. Please try again.","n");busy=false}}
async function onboard(t){say(t,"u");$("#cq").innerHTML="";
 if(ONB.ph==="name"){ONB.name=t.replace(/^["']+|["']+$/g,"").slice(0,80);ONB.ph="rooms";say('Great, "'+ONB.name+'" it is! Which rooms are you choosing finishes for? Tap all that apply, or type your own.',"a");showChoices({choices:COMMON,multi:true});return}
 const rooms=t.split(/,|\band\b/i).map(s=>s.trim()).filter(Boolean);
 try{const p=await api("POST","/api/projects",{name:ONB.name});await api("PUT","/api/projects/"+p.id,{state:Object.assign(blank(),{rooms}),n:0});
  delete LOG.home;delete CHS.home;ONB.ph="name";START=true;await openP(p.id,p.name)}
 catch(e){say("Sorry, I couldn't create the project. "+(e.message||"Please try again."),"n");showChoices({choices:COMMON,multi:true})}}
function submit(t){t=(t||"").trim();if(!t||busy)return;CK==="home"?onboard(t):send(t)}

if(SR){$("#mic").hidden=false;$("#mic").onclick=()=>{try{const r=new SR();r.lang="en-US";r.onresult=e=>{$("#ci").value=e.results[0][0].transcript;$("#cs").click()};r.start()}catch(e){}}}
let INV=null;
(async()=>{let r=null;try{r=await Auth.handleAuthCallback()}catch(e){}
 if(r&&r.type==="invite"&&r.token){INV=r.token;V="setpw";render();return}
 try{ME=(r&&r.user)||await Auth.getUser()}catch(e){}
